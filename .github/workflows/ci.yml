name: CI

on:
  push:
    branches: [main, develop, 'module/**']
  pull_request:
    branches: [main, develop]

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python data/scripts/validate/validate_question_bank.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/VietAIS.Gplx.slnx
      - run: dotnet build backend/VietAIS.Gplx.slnx --no-restore --configuration Release
      - run: dotnet test backend/VietAIS.Gplx.slnx --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
