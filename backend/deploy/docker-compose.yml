services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gplx
      POSTGRES_USER: ${GPLX_POSTGRES_USER:-gplx}
      POSTGRES_PASSWORD: ${GPLX_POSTGRES_PASSWORD:?set GPLX_POSTGRES_PASSWORD}
    ports:
      - "${GPLX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - gplx-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=gplx;Username=${GPLX_POSTGRES_USER:-gplx};Password=${GPLX_POSTGRES_PASSWORD:?set GPLX_POSTGRES_PASSWORD}
      Seed__Enabled: "true"
      Seed__DataRoot: /app/data/normalized
      Jwt__SigningKey: ${GPLX_JWT_SIGNING_KEY:?set GPLX_JWT_SIGNING_KEY}
      Admin__Email: ${GPLX_ADMIN_EMAIL:?set GPLX_ADMIN_EMAIL}
      Admin__PasswordHash: ${GPLX_ADMIN_PASSWORD_HASH:?set GPLX_ADMIN_PASSWORD_HASH}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GPLX_API_PORT:-5080}:8080"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_INTERNAL_BASE: http://api:8080/api
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost}
    depends_on:
      - api
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - frontend
    ports:
      - "${GPLX_NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  gplx-postgres:
