events {}

http {
  upstream gplx_api { server api:8080; }
  upstream gplx_frontend { server frontend:3000; }

  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
      limit_req zone=api_rate burst=60 nodelay;
      proxy_pass http://gplx_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://gplx_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
