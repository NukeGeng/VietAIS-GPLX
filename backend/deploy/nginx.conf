events {}

http {
  upstream gplx_api { server api:8080; }
  upstream gplx_frontend { server frontend:3000; }

  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;
  proxy_cache_path /var/cache/nginx/gplx levels=1:2 keys_zone=gplx_public:10m max_size=100m inactive=10m use_temp_path=off;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/api/(licenses|questions)(/|$) {
      limit_req zone=api_rate burst=60 nodelay;
      proxy_cache gplx_public;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 5m;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_key "$scheme|$request_method|$host|$request_uri";
      add_header X-Cache-Status $upstream_cache_status always;
      proxy_pass http://gplx_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=api_rate burst=60 nodelay;
      proxy_pass http://gplx_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://gplx_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
